<header class="header">
  <div class="header__bar">
    <a class="header__logo" routerLink="/" aria-label="Waveless, ir al inicio" (click)="closeMenu()">
      <img class="header__logoIcon" src="/img/logo-waveless.png" alt="Logo de la web Waveless">
    </a>

    <nav class="header__nav" [class.header__nav--open]="isMenuOpen()" id="header-nav" aria-label="Navegación principal">
      <ul class="header__links">
        @for (link of links; track link.path) {
          <li>
            <a
              class="header__link"
              [routerLink]="link.path"
              routerLinkActive="header__link--active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMenu()"
            >
              @if (link.icon) {
                <img class="header__linkIcon" [src]="'/icons/icon-' + link.icon + '.svg'" alt="">
              }
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
    <a class="header__btn btn-primary" routerLink="/destinos" (click)="closeMenu()">Reserva</a>
    <button
      type="button"
      #menuButton
      class="header__btnBurguer"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="header-nav"
      [attr.aria-label]="isMenuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      (click)="toggleMenu()"
    >
      <img class="header__iconMenu" src="/icons/icon-menu-burguer.svg" alt="">
    </button>
  </div>
</header>
