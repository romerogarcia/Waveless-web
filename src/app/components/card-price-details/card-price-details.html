<wl-modal
  [open]="open()"
  heading="Desglose de precios"
  [anchored]="true"
  (close)="close.emit()"
>
  <p class="breakdown__place">
    <span class="breakdown__placeName">{{ view().place }}</span>
    <span class="breakdown__placeDays">{{ view().duration }}</span>
  </p>

  <div class="breakdown__details">
    @for (row of view().rows; track row.label) {
      <div class="breakdown__row">
        <span class="breakdown__rowLabel">{{ row.label }}</span>
        <span class="breakdown__rowValue">{{ row.value }}</span>
      </div>
    }
  </div>

  <div class="breakdown__totalPrice" modalFooter>
    <span class="breakdown__totalLabel">Precio final</span>
    <span class="breakdown__totalValue">{{ view().total }}</span>
  </div>
</wl-modal>
