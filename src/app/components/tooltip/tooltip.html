<!-- Escape cierra el tooltip sin mover el foco (WCAG 1.4.13, contenido en hover/foco) -->
<span class="tooltip" (mouseenter)="show()" (mouseleave)="hide()" (keydown.escape)="hide()">
  <button
    type="button"
    class="tooltip__trigger"
    (click)="onClick($event)"
    (focus)="show()"
    (blur)="hide()"
    [attr.aria-label]="label()"
    [attr.aria-describedby]="open() ? bubbleId : null"
  >
    <ng-content></ng-content>
  </button>

  @if (open()) {
    <span class="tooltip__bubble" role="tooltip" [id]="bubbleId">{{ text() }}</span>
  }
</span>
