<section class="hero" [attr.aria-label]="label()">
  <!-- init="false": Swiper se configura e inicia desde hero.ts (ver ngAfterViewInit) -->
  <swiper-container
    #swiperEl
    class="hero__swiper"
    init="false"
    (swiperslidechange)="onSlideChange($event)"
  >
    @for (slide of slides(); track $index; let i = $index) {
      <!-- Solo la diapositiva visible es accesible por teclado y lector de pantalla -->
      <swiper-slide class="hero__slide" [attr.inert]="i === activeIndex() ? null : ''">
        <img
          class="hero__bg"
          [src]="slide.image"
          alt=""
          [attr.fetchpriority]="i === 0 ? 'high' : null"
          [attr.loading]="i === 0 ? null : 'lazy'"
        >
        <div class="hero__overlay" aria-hidden="true"></div>

        <div class="hero__content">
          <!-- No es un h1: el título principal de la página lo pone wl-title -->
          <p class="hero__title">{{ slide.title }}</p>
          <p class="hero__subtitle">{{ slide.subtitle }}</p>
          @if (slide.link) {
            <a class="hero__cta btn-primary" [routerLink]="slide.link" [fragment]="slide.fragment">
              Más información<span class="sr-only"> sobre {{ slide.title }}</span>
            </a>
          }
        </div>
      </swiper-slide>
    }
  </swiper-container>

  <!-- Las flechas solo tienen sentido si hay más de una slide -->
  @if (slides().length > 1) {
    <button type="button" class="hero__arrow hero__arrow--prev" aria-label="Diapositiva anterior" (click)="slidePrev()">
      <fa-icon [icon]="faChevronLeft" aria-hidden="true"></fa-icon>
    </button>
    <button type="button" class="hero__arrow hero__arrow--next" aria-label="Diapositiva siguiente" (click)="slideNext()">
      <fa-icon [icon]="faChevronRight" aria-hidden="true"></fa-icon>
    </button>
  }
</section>
