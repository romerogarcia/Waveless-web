<section class="filterResults" aria-label="Resultados">

  <!-- Anuncia a los lectores de pantalla cuántos resultados hay al cambiar un filtro -->
  <p class="sr-only" role="status" aria-live="polite">
    {{ store.resultCount() === 1 ? '1 destino encontrado' : store.resultCount() + ' destinos encontrados' }}
  </p>

  @for (group of store.groups(); track group.heading) {
    <wl-card-group [heading]="group.heading" [destinations]="group.items" />
  } @empty {
    <div class="filterResults__empty">
      <p class="filterResults__emptyText">No hay destinos con estos filtros.</p>
      <button type="button" class="filterResults__emptyBtn btn-secondary" (click)="store.reset()">
        Borrar filtros
      </button>
    </div>
  }
</section>
