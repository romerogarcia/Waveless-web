<!--
  El formulario se pinta dos veces (modal hasta 1199px y aside desde 1200px), así que
  recibe un prefijo para que los ids no se repitan en el DOM.
-->
<ng-template #filtersContent let-prefix="prefix">
  <form class="filters" (submit)="onSubmit($event)">
    @for (group of groups(); track group.key) {
      <div class="filters__section">
        <button
          type="button"
          class="filters__row"
          [class.filters__row--active]="isOpen(group.key)"
          [attr.aria-expanded]="isOpen(group.key)"
          [attr.aria-controls]="prefix + '-panel-' + group.key"
          (click)="toggleSection(group.key)"
        >
          <span
            class="filters__rowIcon"
            [style.--row-icon-url]="'url(/icons/icon-' + group.icon + '.svg)'"
            aria-hidden="true"
          ></span>
          <span class="filters__rowLabel">{{ group.label }}</span>
          <fa-icon
            class="filters__rowChevron"
            [icon]="isOpen(group.key) ? faChevronDown : faChevronRight"
            aria-hidden="true"
          ></fa-icon>
        </button>

        @if (isOpen(group.key)) {
          <fieldset class="filters__fieldset" [id]="prefix + '-panel-' + group.key">
            <legend class="sr-only">{{ group.label }}</legend>

            <div class="filters__checkboxList">
              @for (option of group.options; track option.value) {
                <div class="filters__checkbox">
                  <label class="filters__checkboxMain">
                    <input
                      type="checkbox"
                      [checked]="option.checked"
                      (change)="onOptionChange(group.key, option.value)"
                    />
                    <span class="filters__checkboxLabel">{{ option.label }}</span>
                  </label>
                  @if (option.tooltip) {
                    <wl-tooltip [text]="option.tooltip" [label]="'Más información sobre ' + option.label">
                      <img class="filters__checkboxInfo" src="/icons/icon-info.svg" alt="">
                    </wl-tooltip>
                  }
                </div>
              }
            </div>
          </fieldset>
        }
      </div>
    }

    <div class="filters__section filters__section--last">
      <button
        type="button"
        class="filters__row"
        [class.filters__row--active]="isOpen('precio')"
        [attr.aria-expanded]="isOpen('precio')"
        [attr.aria-controls]="prefix + '-panel-precio'"
        (click)="toggleSection('precio')"
      >
        <span
          class="filters__rowIcon"
          style="--row-icon-url: url('/icons/icon-price-color.svg')"
          aria-hidden="true"
        ></span>
        <span class="filters__rowLabel">Precio</span>
        <fa-icon
          class="filters__rowChevron"
          [icon]="isOpen('precio') ? faChevronDown : faChevronRight"
          aria-hidden="true"
        ></fa-icon>
      </button>

      @if (isOpen('precio')) {
        <fieldset class="filters__fieldset" [id]="prefix + '-panel-precio'">
          <legend class="sr-only">Precio en euros</legend>

          <div class="filters__priceInputs">
            <label class="filters__priceField">
              <span class="filters__priceIcon" aria-hidden="true"></span>
              <span class="sr-only">Precio mínimo en euros</span>
              <input
                type="number"
                inputmode="numeric"
                min="0"
                placeholder="Mínimo"
                class="filters__priceInput"
                [value]="store.state().priceMin ?? ''"
                (input)="onPriceInput('priceMin', $event)"
              />
            </label>
            <label class="filters__priceField">
              <span class="filters__priceIcon" aria-hidden="true"></span>
              <span class="sr-only">Precio máximo en euros</span>
              <input
                type="number"
                inputmode="numeric"
                min="0"
                placeholder="Máximo"
                class="filters__priceInput"
                [value]="store.state().priceMax ?? ''"
                (input)="onPriceInput('priceMax', $event)"
              />
            </label>
          </div>
        </fieldset>
      }
    </div>

    @if (store.activeCount() > 0) {
      <button type="button" class="filters__moreLink filters__reset" (click)="store.reset()">
        Borrar filtros ({{ store.activeCount() }})
      </button>
    }
  </form>
</ng-template>

<!-- Hasta 1199px: botón + modal (se oculta por CSS desde 1200px). -->
<div class="filters__toggleWrap">
  <button
    type="button"
    class="filters__toggleBtn"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog"
  >
    <img class="filters__toggleIcon" src="/icons/icon-filter.svg" alt="">
    Ver filtros
    @if (store.activeCount() > 0) {
      <span class="filters__badge">{{ store.activeCount() }}<span class="sr-only"> activos</span></span>
    }
  </button>
</div>

<wl-modal [open]="open()" heading="Filtrar mi búsqueda" [floatLeft]="true" (close)="toggle()">
  <ng-container *ngTemplateOutlet="filtersContent; context: { prefix: 'modal' }"></ng-container>
</wl-modal>

<!-- Desde 1200px: aside estático siempre visible (se oculta por CSS hasta 1199px). -->
<aside class="filters__sidebar" aria-labelledby="filters-sidebar-heading">
  <div class="filters__sidebarHeader">
    <h2 class="filters__sidebarHeading" id="filters-sidebar-heading">Filtrar mi búsqueda</h2>
  </div>
  <div class="filters__sidebarContent">
    <ng-container *ngTemplateOutlet="filtersContent; context: { prefix: 'sidebar' }"></ng-container>
  </div>
</aside>
